<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Déposer un objet · Donner</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header th:replace="~{fragments :: header}"></header>

    <main>
        <div class="form-shell">
            <a class="breadcrumb" href="/annonces">
                <svg class="icon-sm" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m15 18-6-6 6-6"/>
                </svg>
                <span>Retour aux annonces</span>
            </a>

            <p class="eyebrow">FAIRE CIRCULER</p>
            <h1>Proposer un objet</h1>
            <p class="intro">Un objet utile mérite une nouvelle histoire. Décrivez-le clairement pour faciliter la remise.</p>

            <div class="form-card">
                <p class="meta" th:if="${utilisateurConnecte != null}">
                    Publié sous le profil : <strong th:text="${utilisateurConnecte.name}">Profil</strong>
                </p>

                <div class="alert error" th:if="${erreur}" role="alert" th:text="${erreur}">Erreur</div>

                <form class="editor" th:action="@{/annonces}" method="post" th:object="${annonce}" enctype="multipart/form-data">
                    <label>
                        Titre de l’objet
                        <input required maxlength="180" th:field="*{title}" placeholder="Ex. Lampe de bureau vintage">
                    </label>
                    <label>
                        Description
                        <textarea rows="4" th:field="*{description}" placeholder="Dimensions, état précis, détails utiles pour la remise…"></textarea>
                    </label>
                    <div class="form-row">
                        <label>
                            État
                            <select th:field="*{state}" required>
                                <option th:each="e : ${etats}" th:value="${e}"
                                        th:text="${e.name() == 'NEUF' ? 'Neuf' : (e.name() == 'TRES_BON' ? 'Très bon état' : (e.name() == 'BON' ? 'Bon état' : (e.name() == 'A_REPARER' ? 'À réparer' : e)))}"></option>
                            </select>
                        </label>
                        <label>
                            Mode de remise
                            <select th:field="*{deliveryMode}" required>
                                <option th:each="m : ${modes}" th:value="${m}"
                                        th:text="${m.name() == 'MAIN_PROPRE' ? 'Main propre' : (m.name() == 'ENVOI' ? 'Envoi possible' : (m.name() == 'LES_DEUX' ? 'Main propre ou envoi' : m))}"></option>
                            </select>
                        </label>
                    </div>
                    <div class="form-row">
                        <label>
                            Ville / zone
                            <input required th:field="*{area}" placeholder="Lyon">
                        </label>
                        <label>
                            Mots-clés
                            <input th:field="*{keywords}" placeholder="livre, culture">
                            <span class="form-hint">Séparés par des virgules</span>
                        </label>
                    </div>
                    <div class="form-row">
                        <label>
                            Importer une photo (fichier)
                            <input type="file" name="photo" accept="image/png,image/jpeg,image/webp,image/gif">
                            <span class="form-hint">JPEG, PNG, WebP ou GIF (max 5 Mo)</span>
                        </label>
                        <label>
                            Ou URL d’une image
                            <input maxlength="1000" th:field="*{imageUrl}" placeholder="https://images.unsplash.com/photo-...">
                            <span class="form-hint">Optionnel — prioritaire si aucun fichier n’est importé</span>
                        </label>
                    </div>
                    <button class="button" type="submit">Publier l’annonce</button>
                </form>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
